# Ghost Predator Mobile — PlatformIO Configuration
# O script install.ps1 / install.sh detecta o chip e seleciona o env correto

# ── Dependências comuns (compartilhadas entre ambientes) ──────────────────────
[common]
lib_deps_base =
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    bblanchon/ArduinoJson @ ^7.0.0
    h2zero/NimBLE-Arduino @ ^1.3.9
    adafruit/Adafruit NeoPixel @ ^1.12.3

# ── ESP32 original (WROOM-32, WROVER, DevKit v1) ─────────────────────────────
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
lib_deps = ${common.lib_deps_base}
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DCONFIG_NIMBLE_ENABLED=1

# ── ESP32-S3 N16R8 (8MB Flash + 8MB PSRAM OPI) — HARDWARE DESTA PLACA ────────
# Placa: ESP32-S3-WROOM-1-N16R8 com 2x USB-C (OTG + CH343P serial)
# RGB LED WS2812 no GPIO 48 | USB OTG no conector USB-C esquerdo
# Console disponível via USB CDC (porta USB-C ESQUERDA) e via CH343P (porta DIREITA)
# Para usar console USB: conecte o USB-C esquerdo ao PC → aparece como porta COM
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool
lib_deps = ${common.lib_deps_base}
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DCONFIG_NIMBLE_ENABLED=1
    -DESP32_S3=1
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCONFIG_SPIRAM_MODE_OCT=1
    -mfix-esp32-psram-cache-issue

# ── ESP32-S3 N16R8 variante 16MB Flash ───────────────────────────────────────
[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool
lib_deps = ${common.lib_deps_base}
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DCONFIG_NIMBLE_ENABLED=1
    -DESP32_S3=1
    -DBOARD_HAS_PSRAM=1
    -mfix-esp32-psram-cache-issue
    -DCONFIG_SPIRAM_MODE_OCT=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1

# ── ESP32-C3 (RISC-V, barato) ────────────────────────────────────────────────
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800
lib_deps = ${common.lib_deps_base}
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DESP32_C3=1
